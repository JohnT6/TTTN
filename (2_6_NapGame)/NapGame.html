<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Game - MyE</title>

    <!-- Embed font google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="Header.css">
    <link rel="stylesheet" href="Footer.css">
    <link rel="stylesheet" href="NapGame.css">
</head>

<body>
    <div id="header-container"></div>

    <main id="nap-game-app">
        <section class="banner-section">
            <div class="banner-container">
                <img src="./images/banner đầu trang.png" alt="Cổng nạp chính thức" class="main-banner">
                <button class="btn-history">Lịch sử giao dịch</button>
            </div>
        </section>

        <section class="game-list-section">
            <div class="section-header">
                <h2>DANH SÁCH GAME</h2>
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M16 8C16 3.59 12.41 0 8 0C3.59 0 0 3.59 0 8C0 12.41 3.59 16 8 16C9.85 16 11.54 15.37 12.9 14.31L18 19.41L19.41 18L14.31 12.9C15.4015 11.4995 15.9961 9.77562 16 8ZM2 8C2 4.69 4.69 2 8 2C11.31 2 14 4.69 14 8C14 11.31 11.31 14 8 14C4.69 14 2 11.31 2 8Z"
                            fill="currentColor" />
                    </svg>

                    <input type="text" placeholder="Hào Khí Chiến Hồn">
                </div>
            </div>

            <div class="category-tabs">

            </div>

            <div id="game-grid-container" class="game-grid">
            </div>

            <div class="pagination">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="Header.js"></script>
    <script src="Footer.js"></script>
    <script src="NapGame.js"></script>
</body>

</html>
